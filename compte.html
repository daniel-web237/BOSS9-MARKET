<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" sizes="32x32" href="favicon-32.png">
<link rel="icon" sizes="16x16" href="favicon-16.png">
  <title>Mon compte — BOSS9 Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="compte.css">
  <link rel="stylesheet" href="toast.css">
  <script src="toast.js"></script>
</head>

<body>

<header class="dash-header">
  <a href="produits.html" class="back">← Retour à l'accueil</a>
</header>

<main class="account-page">
  <h2>Mon compte</h2>
  <p class="intro">Gère tes informations, suis tes commandes et retrouve tes favoris.</p>

  <div class="profile-card">
    <div class="profile-top">
      <div class="avatar" id="avatarInitial">?</div>
      <div>
        <div class="profile-name" id="profileName">Chargement...</div>
        <div class="profile-email" id="profileEmail"></div>
        <span class="role-badge" id="profileRole"></span>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="fullname">Nom complet</label>
        <input id="fullname" placeholder="Ton nom">
      </div>
      <div class="field">
        <label for="phone">Téléphone</label>
        <input id="phone" placeholder="Ton numéro">
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" disabled>
      </div>
    </div>

    <button id="saveBtn" class="btn-save">Enregistrer les modifications</button>
  </div>

  <div class="section-card">
    <h3>Mes commandes</h3>
    <p class="section-sub">L'historique de tes achats apparaîtra ici</p>
    <div class="empty-box" id="ordersBox">Aucune commande pour le moment</div>
  </div>

  <div class="section-card">
    <h3>Mes favoris</h3>
    <p class="section-sub">Les produits que tu as sauvegardés</p>
    <div class="empty-box" id="favoritesBox">Aucun favori pour le moment</div>
  </div>

  <div class="logout-row">
    <button class="btn-logout" onclick="logout()">Se déconnecter</button>
  </div>
</main>

<script type="module" src="compte.js"></script>

</body>
</html>

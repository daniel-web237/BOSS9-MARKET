<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — BOSS9 Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="toast.css">
  <script src="toast.js"></script>
</head>

<body>

<div class="auth-container">

  <img src="logo.png" alt="BOSS9 Market">

  <h2>Mot de passe oublié</h2>
  <p class="subtitle">Entre ton email, on t'envoie un lien pour le réinitialiser</p>

  <div class="input-group">
    <input type="email" id="resetEmail" placeholder="Email">
    <label>Email</label>
  </div>

  <button class="auth-btn" onclick="sendResetLink()">Envoyer le lien</button>

  <p class="auth-link">
    <a href="login.html">← Retour à la connexion</a>
  </p>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>

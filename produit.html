<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    (function () {
      var t = localStorage.getItem("boss9_theme") ||
              (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <title>Produit — BOSS9 Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="produit.css">
  <link rel="stylesheet" href="toast.css">
  <script src="toast.js"></script>
  <script src="theme.js" defer></script>
</head>
<body>
<header class="dash-header">
  <a href="produits.html" class="back">← Retour aux produits</a>
  <button type="button" class="theme-toggle-btn" aria-label="Changer de thème">🌙</button>
</header>
<main class="product-page" id="productPage">
  <p class="state-message">Chargement du produit...</p>
</main>
<script type="module" src="produit.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" sizes="32x32" href="favicon-32.png">
<link rel="icon" sizes="16x16" href="favicon-16.png">
  <title>Boutique — BOSS9 Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="boutique.css">
  <link rel="stylesheet" href="toast.css">

<body>

<header class="dash-header">
  <a href="index.html" class="logo"><img src="logo.png" alt="BOSS9 Market"></a>
  <a href="boutiques.html" class="back">← Toutes les boutiques</a>
</header>

<div class="shop-banner"></div>

<div class="shop-profile">
  <div class="shop-header" id="shopHeader">
    <div class="shop-avatar-big" id="shopAvatar">?</div>
    <div class="shop-header-info">
      <h1 id="shopName">Chargement...</h1>
      <div class="shop-header-meta">
        <span class="shop-category-badge" id="shopCategory"></span>
        <span class="shop-product-count" id="shopCount"></span>
      </div>
    </div>
  </div>
</div>

<section class="shop-products-section">
  <h3>Produits de cette boutique</h3>
  <div class="shop-products-grid" id="shopProducts">
    <p class="empty-state">Chargement des produits...</p>
  </div>

<script type="module" src="boutique.js"></script>

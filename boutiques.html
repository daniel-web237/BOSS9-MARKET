<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" sizes="32x32" href="favicon-32.png">
<link rel="icon" sizes="16x16" href="favicon-16.png">
  <title>Boutiques — BOSS9 Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="boutiques.css">

<body>

<header class="dash-header">

</header>

<main class="boutiques-page">

  <div class="category-filters" id="categoryFilters">
    <button data-category="all" class="active">Toutes</button>

    <button data-category="maison">Maison</button>
